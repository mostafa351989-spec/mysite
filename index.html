<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Ultra Store</title>
<style>
body{margin:0;font-family:Tahoma;background:#05060a;color:#fff;overflow-x:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,#00ff99,transparent 40%),radial-gradient(circle at 80% 30%,#00aaff,transparent 40%),radial-gradient(circle at 50% 80%,#7c3aed,transparent 40%);filter:blur(60px);opacity:0.25;animation:move 8s infinite alternate;z-index:-1}
@keyframes move{0%{transform:scale(1)}100%{transform:scale(1.2) translate(30px,20px)}}
header{text-align:center;padding:40px}
h1{color:#00ff99;text-shadow:0 0 20px #00ff99}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:20px}
.card{background:#0d1117;padding:15px;border-radius:15px;border:1px solid #1f2937;transition:.3s}
.card:hover{transform:scale(1.05);box-shadow:0 0 20px #00ff99}
button{width:100%;padding:10px;border:none;border-radius:10px;cursor:pointer;background:linear-gradient(90deg,#00ff99,#00aaff,#7c3aed);color:#000;font-weight:bold}
.cart{position:fixed;bottom:20px;left:20px;background:#111827;padding:15px;border-radius:10px;border:1px solid #00ff99;width:220px}
</style>
</head>
<body>

<div class="bg"></div>

<header>
<h1>Neon Ultra Store</h1>
<p>بيع مواقع ومتاجر جاهزة</p>
</header>

<div class="grid">
<div class="card">
<h3>موقع شركة</h3>
<p>تصميم احترافي</p>
<button onclick="add('موقع شركة',500)">إضافة</button>
</div>

<div class="card">
<h3>متجر إلكتروني</h3>
<p>سلة + منتجات</p>
<button onclick="add('متجر',1200)">إضافة</button>
</div>
</div>

<div class="cart">
<h3>🛒 السلة</h3>
<div id="list">فارغة</div>
</div>

<script>
let cart=[]
function add(n,p){cart.push(n);render()}
function render(){list.innerHTML=cart.length?cart.join("<br>"):"فارغة"}
</script>

</body>
</html>
