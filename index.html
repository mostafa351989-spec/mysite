<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sci-Fi Neon Store</title>

<style>
body{margin:0;font-family:Tahoma;background:#05060a;color:#fff;overflow-x:hidden}
.bg{position:fixed;inset:0;background:
radial-gradient(circle at 20% 20%,#00ff99,transparent 35%),
radial-gradient(circle at 80% 30%,#00aaff,transparent 40%),
radial-gradient(circle at 50% 80%,#7c3aed,transparent 40%);
filter:blur(70px);opacity:0.25;animation:move 10s infinite alternate;z-index:-1}
@keyframes move{0%{transform:scale(1)}100%{transform:scale(1.25) translate(30px,20px)}}
header{padding:80px 20px;text-align:center}
h1{font-size:48px;color:#00ff99;text-shadow:0 0 25px #00ff99}
p{color:#aaa}
section{padding:60px 20px;max-width:1100px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:rgba(10,15,25,0.7);backdrop-filter:blur(12px);border:1px solid rgba(0,255,153,0.2);padding:18px;border-radius:18px;transition:.4s}
.card:hover{transform:translateY(-10px) scale(1.05);box-shadow:0 0 25px #00ff99}
button{width:100%;padding:12px;border:none;border-radius:12px;cursor:pointer;font-weight:bold;background:linear-gradient(90deg,#00ff99,#00aaff,#7c3aed);color:#000}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-top:30px}
.feature{background:#0d1117;padding:15px;border-radius:12px;border:1px solid #1f2937;text-align:center}
.cart{position:fixed;bottom:0;left:0;width:100%;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);border-top:1px solid #00ff99;padding:15px;display:flex;justify-content:space-between;align-items:center}
.total{color:#00aaff;font-weight:bold}
.checkout{background:#00ff99;border:none;padding:10px 20px;border-radius:10px;cursor:pointer;font-weight:bold}
footer{text-align:center;padding:50px 20px;color:#666}
</style>

</head>
<body>

<div class="bg"></div>

<header>
<h1>Sci-Fi Neon Store</h1>
<p>متجر مواقع مستقبلية بتصميم خيالي</p>
</header>

<section>
<div class="features">
<div class="feature">⚡ سرعة عالية</div>
<div class="feature">🚀 تصميم خيالي</div>
<div class="feature">💎 جاهز للبيع</div>
<div class="feature">📱 متجاوب</div>
</div>
</section>

<section>
<h2>🔥 المنتجات</h2>

<div class="grid">

<div class="card">
<h3>موقع شركة فضائي</h3>
<p>تصميم احترافي مستقبلّي</p>
<button onclick="add('موقع شركة فضائي',500)">إضافة</button>
</div>

<div class="card">
<h3>متجر ذكي</h3>
<p>سلة + تصميم SaaS</p>
<button onclick="add('متجر ذكي',1200)">إضافة</button>
</div>

<div class="card">
<h3>موقع مطعم 3D</h3>
<p>منيو تفاعلي</p>
<button onclick="add('مطعم 3D',400)">إضافة</button>
</div>

</div>
</section>

<footer>
Neon Sci-Fi Store ©
</footer>

<div class="cart">
<div>🛒 <span id="items">فارغة</span></div>
<div class="total">الإجمالي: <span id="total">0</span></div>
<button class="checkout" onclick="checkout()">اطلب</button>
</div>

<script>
let cart=[];
let total=0;

function add(n,p){
cart.push({n,p});
total+=p;
render();
}

function render(){
items.innerHTML=cart.length?cart.map(c=>"• "+c.n).join(" | "):"فارغة";
totalEl.innerText=total;
}

function checkout(){
if(!cart.length)return alert("فارغة");
let msg="طلب:%0A";
cart.forEach(c=>msg+=c.n+" ("+c.p+")%0A");
window.open("https://wa.me/201000000000?text="+msg,"_blank");
}
</script>

</body>
</html>
